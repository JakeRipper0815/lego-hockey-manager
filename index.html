function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Speichern fehlgeschlagen. Bitte JSON-Sicherung herunterladen.')}}function notice(s){$('notice').textContent=s}function go(t){tab=t;editing=null;render()}function player(id){return state.players.find(p=>p.id===Number(id))}function nextId(){return Math.max(-1,...state.players.map(p=>p.id))+1}function isAdmin(){return selected===state.adminIndex}function guard(){if(isAdmin())return true;alert('Nur der aktuelle Admin darf das. Wähle '+state.managers[state.adminIndex].name+' im Manager-Menü.');return false}function badge(p){return `<span class="tag ${p.position}">${p.position}</span>`}
function managerSelect(){return `<label>Manager: <select onchange="selected=Number(this.value);render()">${state.managers.map((m,i)=>`<option value="${i}" ${selected===i?'selected':''}>${esc(m.name)}${i===state.adminIndex?' 🛡️':''}</option>`).join('')}</select></label>`}
function card(p,action=''){return `<div class="card row"><div><b>${esc(p.name)}</b> ${badge(p)}<div class="muted">${esc(p.team)} · ${euro(p.value)} · ${p.points} Punkte</div></div>${action}</div>`}
function buy(id){let p=player(id);if(!p||p.owner===selected)return;let v=prompt('Geheimes Gebot für '+p.name+' in Millionen € (nur dein Gebot ist sichtbar):',state.auctions[id]?.[selected]??p.value);if(v===null)return;v=Number(v.replace(',','.'));if(!Number.isFinite(v)||v<=0)return alert('Ungültiges Gebot');state.auctions[id]??={};if(v<(state.auctions[id][selected]||0))return alert('Du kannst dein Gebot nur erhöhen.');state.auctions[id][selected]=v;save();render();notice('Dein geheimes Gebot wurde gespeichert.');}
function removeLineups(id){Object.values(state.lineups).forEach(l=>{l.starters=l.starters.map(x=>x===id?null:x);l.bench=l.bench.map(x=>x===id?null:x)})}
function sell(id){if(state.locked)return alert('Aufstellungen gesperrt');let p=player(id);if(!p||p.owner!==selected)return;if(state.market.includes(id))return alert('Spieler ist bereits angeboten');state.market.push(id);save();render();notice('Spieler auf dem Transfermarkt angeboten.');}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refreshMarket(){if(!guard())return;if(!confirm('Geheime Auktionen jetzt abschließen und neue Angebote einstellen?'))return;for(const id of state.market){let p=player(id);if(!p)continue;let bids=Object.entries(state.auctions[id]||{}).map(([i,v])=>({i:Number(i),v:Number(v)})).sort((a,b)=>b.v-a.v||a.i-b.i);let winner=bids.find(b=>b.i!==p.owner);if(winner){if(p.owner>=0){state.managers[p.owner].cash=+(state.managers[p.owner].cash+winner.v).toFixed(2);removeLineups(p.id)}state.managers[winner.i].cash=+(state.managers[winner.i].cash-winner.v).toFixed(2);p.owner=winner.i;} }state.auctions={};let free=shuffle(state.players.filter(p=>p.owner===-1));state.market=free.slice(0,Math.min(6,free.length)).map(p=>p.id);save();render();notice('Auktionen abgeschlossen. Neue Angebote verfügbar.');}
function formationChange(v){if(state.locked)return;let l=state.lineups[selected],next=FORM[v];if(!next)return;let pool=l.starters.map(player).filter(p=>p&&p.owner===selected);let assigned=Array(6).fill(null);next.forEach((pos,i)=>{let p=pool.find(p=>p.position===pos&&!assigned.includes(p.id));if(p)assigned[i]=p.id});l.formation=v;l.starters=assigned;save();render()}
function choose(kind,index){if(state.locked)return;let l=state.lineups[selected],pos=kind==='starter'?FORM[l.formation][index]:BENCH[index],current=kind==='starter'?l.starters[index]:l.bench[index];let used=[...l.starters,...l.bench].filter(id=>id!==null&&id!==current);let options=state.players.filter(p=>p.owner===selected&&p.position===pos&&!used.includes(p.id));let d=$('picker');d.innerHTML=`<h3>${pos} besetzen</h3><button class="choice" data-id="">➖ Platz freilassen</button>${options.map(p=>`<button class="choice" data-id="${p.id}">${esc(p.name)} · ${euro(p.value)}</button>`).join('')||'<p>Keine passenden Spieler im Kader.</p>'}<button onclick="document.getElementById('picker').close()">Abbrechen</button>`;d.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let id=b.dataset.id===''?null:Number(b.dataset.id);if(kind==='starter')l.starters[index]=id;else l.bench[index]=id;d.close();save();render()});d.showModal()}
function rink(){let l=state.lineups[selected],pos=FORM[l.formation],front=pos.map((p,i)=>({p,i})).filter(x=>x.p==='O'||x.p==='ST'),back=pos.map((p,i)=>({p,i})).filter(x=>x.p==='DF'),xy={};front.forEach((x,k)=>xy[x.i]={x:100*(k+1)/(front.length+1),y:front.length===1?25:22+(k%2)*10});back.forEach((x,k)=>xy[x.i]={x:100*(k+1)/(back.length+1),y:back.length===4?65+(k%2)*8:67});xy[pos.indexOf('GK')]={x:50,y:89};let slots=pos.map((p,i)=>{let s=player(l.starters[i]),a=xy[i];return `<button class="slot ${p}" style="left:${a.x}%;top:${a.y}%" onclick="choose('starter',${i})" ${state.locked?'disabled':''}><b>${p}</b>${s?esc(s.name):'+ Spieler'}</button>`}).join('');return `<div class="card"><h3>Aufstellung · Spieltag ${state.round}</h3><label>Formation <select onchange="formationChange(this.value)" ${state.locked?'disabled':''}>${Object.keys(FORM).map(n=>`<option ${n===l.formation?'selected':''}>${n}</option>`).join('')}</select></label><p class="status">${state.locked?'🔒 Aufstellung gesperrt':'🔓 Tippe auf eine Position und wähle einen Spieler.'}</p><div class="rink"><svg viewBox="0 0 340 470" preserveAspectRatio="none" aria-hidden="true"><path d="M0 150H340 M0 320H340" stroke="#2b78bd" stroke-width="3"/><path d="M0 235H340" stroke="#c93443" stroke-width="3"/><circle cx="170" cy="235" r="51" stroke="#2b78bd" stroke-width="3" fill="none"/><circle cx="170" cy="235" r="4" fill="#2b78bd"/><circle cx="83" cy="88" r="29" stroke="#c93443" stroke-width="2" fill="none"/><circle cx="257" cy="88" r="29" stroke="#c93443" stroke-width="2" fill="none"/><circle cx="83" cy="382" r="29" stroke="#c93443" stroke-width="2" fill="none"/><circle cx="257" cy="382" r="29" stroke="#c93443" stroke-width="2" fill="none"/><path d="M139 468v-22q31-27 62 0v22" fill="#acd4f2" stroke="#c93443" stroke-width="3"/></svg>${slots}</div><h3>Ersatzbank</h3><div class="bench">${BENCH.map((p,i)=>{let s=player(l.bench[i]);return `<button class="${p}" onclick="choose('bench',${i})" ${state.locked?'disabled':''}>${p} · ${s?esc(s.name):'+ Ersatz'}</button>`}).join('')}</div><p class="muted">Nur positionsgleiche Spieler. Bei 0 Punkten kann ein Ersatzspieler mit mehr als 0 Punkten einmal einspringen.</p></div>`}
function totals(){return state.managers.map((m,i)=>{if(m.cash<0)return 0;let l=state.lineups[i],used=new Set(),score=0;FORM[l.formation].forEach((pos,j)=>{let p=player(l.starters[j]);if(!p||p.owner!==i||p.position!==pos){score-=4;return}let pts=Number(p.points)||0;if(pts===0){let k=BENCH.indexOf(pos),b=player(l.bench[k]);if(k>=0&&!used.has(k)&&b&&b.owner===i&&b.position===pos&&b.points>0){pts=b.points;used.add(k)}}score+=pts});return score})}
function lock(){if(!guard()||state.locked)return;if(!confirm('Alle Aufstellungen sperren?'))return;state.locked=true;save();render()}
function finish(){if(!guard())return;if(!state.locked)return alert('Bitte erst Aufstellungen sperren.');if(!confirm('Spieltag abschließen und Punkte abrechnen?'))return;let t=totals();t.forEach((n,i)=>state.managers[i].points+=n);state.players.forEach(p=>{let change=(p.points-5)*.045+(Math.random()-.5)*.12;p.value=Math.min(p.position==='GK'?7:100,Math.max(.5,Math.round(p.value*(1+change)*100)/100));p.points=0});state.round++;state.locked=false;/* Markt bleibt bis zur Admin-Aktualisierung unverändert */save();render();notice('Abgerechnet: '+t.map((n,i)=>state.managers[i].name+' '+n).join(' · '))}
function setPoints(id,v){if(!guard())return;let p=player(id);if(p){p.points=Number(v)||0;save()}}
function editPlayer(id){if(!guard())return;editing=id;render();window.scrollTo(0,0)}
function savePlayer(){if(!guard())return;let name=$('editName').value.trim(),position=$('editPos').value,club=$('editClub').value,value=Number($('editValue').value.replace(',','.'));if(!state.clubs.includes(club))return alert('Bitte Hockeyteam wählen.');if(position==='GK'&&value>7)return alert('Torwart-Marktwert maximal 7 Mio.');if(!name||!POS.includes(position)||!Number.isFinite(value)||value<=0)return alert('Name, Position und positiven Wert eingeben.');value=Math.round(value*100)/100;if(editing===null)state.players.push({id:nextId(),name,team:club,position,value,owner:-1,points:0});else{let p=player(editing);if(!p)return;if(state.locked&&p.position!==position)return alert('Position während Sperre nicht änderbar.');if(p.position!==position)removeLineups(p.id);Object.assign(p,{name,team:club,position,value})}editing=null;save();render();notice('Spieler gespeichert.')}
function deletePlayer(id){if(!guard()||state.locked)return;let p=player(id);if(!p||!confirm('Spieler „'+p.name+'“ endgültig löschen?'))return;removeLineups(id);state.players=state.players.filter(p=>p.id!==id);state.market=state.market.filter(x=>x!==id);editing=null;save();render()}
function makeAdmin(i){if(!guard())return;if(i===state.adminIndex)return;if(!confirm('Admin-Rechte an '+state.managers[i].name+' übertragen?'))return;state.adminIndex=i;selected=i;save();render();notice('Neuer Admin: '+state.managers[i].name)}
function rename(i){if(!guard())return;let name=prompt('Neuer Name für '+state.managers[i].name,state.managers[i].name);if(name===null)return;name=name.trim();if(!name)return alert('Name darf nicht leer sein.');state.managers[i].name=name;save();render()}

function buildFixtures(clubs){let a=[...clubs];if(a.length%2)a.push(null);let n=a.length,rounds=[];for(let r=0;r<n-1;r++){let games=[];for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i];if(x&&y)games.push(r%2?[y,x]:[x,y]);}rounds.push(games);a=[a[0],a[n-1],...a.slice(1,n-1)];}return [...rounds,...rounds.map(g=>g.map(([a,b])=>[b,a]))];}
function startNewSeason(){if(!guard())return;if(!confirm('Neue Saison starten? Alte Ergebnisse und Punkte werden zurückgesetzt.'))return;if(!confirm('Wirklich eine NEUE SAISON mit neuem Spielplan starten?'))return;state.round=1;state.locked=false;state.scores={};state.fixtures=buildFixtures(state.clubs);state.managers.forEach(m=>m.points=0);state.players.forEach(p=>p.points=0);save();render();notice('Neue Saison gestartet.');}
function addClub(){if(!guard())return;let name=prompt('Name des neuen Hockeyteams:');if(!name)return;name=name.trim();if(!name||state.clubs.some(c=>c.toLowerCase()===name.toLowerCase()))return alert('Name fehlt oder existiert bereits');state.clubs.push(name);save();render();}
function removeClub(i){if(!guard())return;let name=state.clubs[i];if(state.players.some(p=>p.team===name))return alert('Bitte zuerst alle Spieler dieses Clubs einem anderen Team zuordnen.');if(!confirm(name+' aus der Liga entfernen?'))return;state.clubs.splice(i,1);save();render();}
function addManager(){if(!guard())return;let name=prompt('Name des neuen Managers:');if(!name?.trim())return;state.managers.push({name:name.trim(),cash:30,points:0});normalize();save();render();}
function removeManager(i){if(!guard())return;if(i===state.adminIndex)return alert('Admin erst übertragen.');if(!confirm(state.managers[i].name+' entfernen und dessen Spieler freigeben?'))return;state.players.forEach(p=>{if(p.owner===i){p.owner=-1;removeLineups(p.id)}else if(p.owner>i)p.owner--});state.managers.splice(i,1);if(state.adminIndex>i)state.adminIndex--;state.lineups={};state.auctions={};normalize();selected=0;save();render();}
function scoreMatch(r,i,side,value){if(!guard())return;let key=r+'-'+i;state.scores[key]??=[0,0];state.scores[key][side]=Math.max(0,Math.floor(Number(value)||0));save();}
function resetAll(){if(!guard())return;if(!confirm('ALLE Saison-, Kader- und Transferdaten zurücksetzen?'))return;if(!confirm('LETZTE BESTÄTIGUNG: Der bisherige Spielstand geht verloren.'))return;let clubs=[...state.clubs],managers=state.managers.map(m=>m.name),admin=state.adminIndex;state=fresh();state.clubs=clubs;state.managers=managers.map(name=>({name,cash:30,points:0}));state.adminIndex=admin;state.fixtures=buildFixtures(clubs);state.players.forEach(p=>p.owner=-1);normalize();let taken=new Set();for(let i=0;i<state.managers.length;i++){let g=state.players.filter(p=>p.position==='GK'&&!taken.has(p.id)).sort((a,b)=>a.value-b.value)[0];let others=state.players.filter(p=>p.position!=='GK'&&!taken.has(p.id)).sort((a,b)=>Math.abs(a.value+b.value-12)-(Math.abs(b.value+a.value-12)));if(g){g.owner=i;taken.add(g.id)}let candidates=state.players.filter(p=>p.position!=='GK'&&!taken.has(p.id)).sort((a,b)=>Math.abs(a.value-(12-(g?.value||0))/2)-Math.abs(b.value-(12-(g?.value||0))/2));candidates.slice(0,2).forEach(p=>{p.owner=i;taken.add(p.id)});}state.market=state.players.filter(p=>p.owner===-1).slice(0,6).map(p=>p.id);save();render();notice('Vollständiger Neustart durchgeführt.');}

function render(){let out='';if(tab==='market'){out='<h2>🔁 Transfermarkt · geheime Auktionen</h2>'+managerSelect()+`<p>Budget: <b>${euro(state.managers[selected].cash)}</b></p>`+state.market.map(id=>{let p=player(id);return p?card(p,`<button onclick="buy(${id})" ${p.owner===selected?'disabled':''}>Geheim bieten</button><span class="muted">${state.auctions[id]?.[selected]?'Dein Gebot: '+euro(state.auctions[id][selected]):'Noch kein Gebot'}</span>`):''}).join('')+(isAdmin()?'<button onclick="refreshMarket()">🔄 Transfermarkt erneuern (Admin)</button>':'');if(!state.market.length)out+='<p>Keine Angebote. Admin kann den Markt erneuern.</p>'}
if(tab==='teams'){out='<h2>Mannschaften</h2>'+managerSelect()+`<p>Budget: ${euro(state.managers[selected].cash)}</p>`+rink()+'<h3>Mein Kader</h3>'+state.players.filter(p=>p.owner===selected).map(p=>card(p,`<button onclick="sell(${p.id})" ${state.locked||state.market.includes(p.id)?'disabled':''}>Anbieten</button>`)).join('');if(!state.players.some(p=>p.owner===selected))out+='<p>Keine Spieler im Kader. Kaufe Spieler auf dem Transfermarkt.</p>'}
if(tab==='round'){out=`<h2>Spieltag ${state.round}</h2>`+managerSelect()+`<p class="status">${state.locked?'🔒 Aufstellungen gesperrt':'🔓 Aufstellungen offen'}</p>`+(isAdmin()?state.players.map(p=>`<div class="card row"><div>${esc(p.name)} ${badge(p)}</div><label>Punkte <input type="number" style="width:85px" step="1" value="${p.points}" onchange="setPoints(${p.id},this.value)"></label></div>`).join('')+(state.locked?'<button onclick="finish()">✅ Spieltag abschließen</button>':'<button onclick="lock()">🔒 Aufstellungen sperren</button>'):'<p>Nur der aktuelle Admin trägt Spielerpunkte ein und schließt Spieltage ab.</p>')+'<p class="muted">Unbesetzter Stammplatz: −4 Punkte. Negatives Budget: insgesamt 0 Spieltagspunkte. Ersatzbank ist freiwillig.</p>'}
if(tab==='table'){out='<h2>Manager-Tabelle</h2><img class="hero-img" src="'+TABLE_IMG+'" alt="Original-Design Manager-Tabelle">'+[...state.managers].sort((a,b)=>b.points-a.points).map((m,i)=>`<div class="card">${i+1}. <b>${esc(m.name)}</b> · ${m.points} Punkte · ${euro(m.cash)}</div>`).join('')}
if(tab==='players'){out='<h2>Spieler verwalten</h2>'+managerSelect();if(isAdmin())out+=`<div class="card"><h3>${editing===null?'Spieler anlegen':'Spieler bearbeiten'}</h3><div class="form"><label>Name<input id="editName" maxlength="100"></label><label>Hockeyteam<select id="editClub">${state.clubs.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Position<select id="editPos">${POS.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Wert (Mio.)<input id="editValue" type="number" min=".01" step=".01"></label></div><button onclick="savePlayer()">💾 Speichern</button>${editing!==null?'<button onclick="editing=null;render()">Abbrechen</button>':''}</div>`;out+='<h3>Alle Spieler ('+state.players.length+')</h3>'+state.players.map(p=>card(p,isAdmin()?`<button onclick="editPlayer(${p.id})">Bearbeiten</button><button class="danger" onclick="deletePlayer(${p.id})" ${state.locked?'disabled':''}>Löschen</button>`:'')).join('')}
if(tab==='admin'){out='<h2>🛡️ Spielleiter</h2>'+managerSelect()+(isAdmin()?`<div class="card"><h3>Transfermarkt</h3><button onclick="refreshMarket()">🔄 Angebote neu mischen</button><p class="muted">Es werden bis zu vier freie Spieler angeboten. Gekaufte Spieler bleiben bei ihren Managern.</p></div><div class="card"><h3>Manager umbenennen</h3>${state.managers.map((m,i)=>`<div class="row"><span>${esc(m.name)}${i===state.adminIndex?' (Admin)':''}</span><button onclick="rename(${i})">Umbenennen</button>${i!==state.adminIndex?`<button onclick="makeAdmin(${i})">Zum Admin machen</button>`:''}</div>`).join('')}</div><div class="card"><h3>Manager verwalten</h3><button onclick="addManager()">➕ Manager hinzufügen</button>${state.managers.map((m,i)=>`<div class="row">${esc(m.name)} ${i!==state.adminIndex?`<button class="danger" onclick="removeManager(${i})">Entfernen</button>`:''}</div>`).join('')}</div><div class="card"><h3>Neue Saison / Reset</h3><button onclick="startNewSeason()">🏆 Neue Saison starten</button><button class="danger" onclick="resetAll()">Alles zurücksetzen (2× bestätigen)</button></div><div class="card"><h3>Spieltag ${state.round}</h3><button onclick="go('round')">Punkte & Spieltag verwalten</button></div>`:'<p>Nur der aktuelle Admin darf den Transfermarkt erneuern, Manager umbenennen und Spieltage verwalten.</p>')}

if(tab==='clubs'){out='<h2>🏆 Liga verwalten</h2>'+managerSelect()+'<div class="card"><h3>Hockeyteams ('+state.clubs.length+')</h3>'+state.clubs.map((c,i)=>`<div class="row clubrow"><b>${esc(c)}</b>${isAdmin()?`<button class="danger" onclick="removeClub(${i})">Entfernen</button>`:''}</div>`).join('')+(isAdmin()?'<button onclick="addClub()">➕ Hockeyteam hinzufügen</button>':'')+'</div><p class="muted">Spieler eines Clubs müssen vor dessen Entfernung einem anderen Club zugeordnet werden. Der Spielplan wird beim Start der neuen Saison neu erstellt.</p>'}
if(tab==='schedule'){let max=state.fixtures.length;let r=Math.min(Math.max(1,state.round),max||1);out='<h2>🏒 Spielplan</h2><img class="hero-img" src="'+SCHEDULE_IMG+'" alt="Original LEGO Spielplan-Design">'+managerSelect()+`<div class="card"><h3>${state.clubs.length} Teams · ${max} Spieltage</h3><label>Spieltag <select onchange="state.round=Number(this.value);save();render()">${state.fixtures.map((g,i)=>`<option value="${i+1}" ${r===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label></div>`+(state.fixtures[r-1]||[]).map(([a,b],i)=>{let s=state.scores[(r-1)+'-'+i]||['',''];return `<div class="card fixture"><b>${esc(a)}</b><div class="score"><input aria-label="Tore Heim" type="number" min="0" value="${s[0]}" onchange="scoreMatch(${r-1},${i},0,this.value)" ${!isAdmin()?'disabled':''}><span>:</span><input aria-label="Tore Gast" type="number" min="0" value="${s[1]}" onchange="scoreMatch(${r-1},${i},1,this.value)" ${!isAdmin()?'disabled':''}></div><b>${esc(b)}</b></div>`}).join('');}
if(tab==='backup'){out='<h2>Sicherung</h2><button onclick="backup()">JSON-Sicherung herunterladen</button><p><label>Sicherung importieren <input type="file" accept=".json,application/json" onchange="restore(event)"></label></p><button class="danger" onclick="reset()">Test zurücksetzen</button><p class="muted">Daten werden lokal auf diesem Gerät gespeichert. Andere Geräte synchronisieren sich nicht automatisch. Die Admin-Rolle ist in dieser Offline-Version nicht passwortgeschützt.</p>'}
$('app').innerHTML=out;if(tab==='players'&&isAdmin()&&editing!==null){let p=player(editing);if(p){$('editName').value=p.name;$('editPos').value=p.position;$('editClub').value=p.team;$('editValue').value=p.value}}}
function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='hockey-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let s=JSON.parse(t);if(!Array.isArray(s.players)||!Array.isArray(s.managers))throw Error();if(!confirm('Aktuellen Spielstand durch Sicherung ersetzen?'))return;state=s;normalize();selected=0;editing=null;save();render();notice('Sicherung geladen')}).catch(()=>alert('Ungültige Sicherung'))}
function reset(){resetAll()}
render();
</script></body></html>
