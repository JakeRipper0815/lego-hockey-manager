
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEGO Hockey Manager</title>

<style>
body {
  font: 16px system-ui;
  background: #101827;
  color: #f2f5fa;
  margin: auto;
  padding: 16px;
  max-width: 850px;
}
h1 { font-size: 25px; }
button, select, input {
  font: inherit;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #64748b;
}
button {
  background: #38bdf8;
  color: #06121d;
  font-weight: 700;
  margin: 4px;
  cursor: pointer;
}
button:disabled { opacity: .35; }
input[type=number] { width: 110px; }
nav button {
  background: #24344c;
  color: white;
}
.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0;
}
.muted {
  color: #cbd5e1;
  font-size: 13px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
strong { color: #7dd3fc; }
#notice { color: #86efac; }
label { display: inline-block; margin: 5px; }
.danger { background: #f87171; }
.position {
  padding: 4px 9px;
  border-radius: 7px;
  font-weight: bold;
  display: inline-block;
}
.DF { background: #dc2626; color: white; }
.O { background: #2563eb; color: white; }
.ST { background: #111; color: white; }
.GK { background: #facc15; color: black; }
.form-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.form-grid label {
  display: flex;
  flex-direction: column;
}
.form-grid input, .form-grid select {
  width: 180px;
  max-width: 100%;
  box-sizing: border-box;
}
</style>
</head>

<body>

<h1>🏒 LEGO Hockey Manager</h1>
<p class="muted">Private Spielversion</p>

<nav>
<button onclick="tab='market';render()">Transfermarkt</button>
<button onclick="tab='teams';render()">Mannschaften</button>
<button onclick="tab='round';render()">Spieltag</button>
<button onclick="tab='table';render()">Tabelle</button>
<button onclick="tab='players';editingId=null;render()">Spieler verwalten</button>
<button onclick="tab='backup';render()">Sicherung</button>
</nav>

<p id="notice"></p>
<main id="app"></main>

<script>
const names = [
'Mika Blitz','Leo Frost','Finn Stahl','Noah Sturm',
'Ben Eis','Timo Komet','Luca Nord','Paul Klinge',
'Elias Turbo','Max Polar','Oskar Wolf','Jan Rakete'
];

function fresh() {
  return {
    round: 1,
    managers: [
      {name:'Manager Rot',cash:30,points:0},
      {name:'Manager Blau',cash:30,points:0},
      {name:'Manager Grün',cash:30,points:0}
    ],
    players: names.map((name,id)=>({
      id,
      name,
      team:['Eisbären','Wölfe','Pinguine'][id%3],
      position:'DF',
      value:3+id%5,
      owner:-1,
      points:0
    })),
    market:[0,1,2,3]
  };
}

let state;
try {
  state=JSON.parse(localStorage.getItem('legoHockeyV1'))||fresh();
} catch(e) {
  state=fresh();
}

let tab='market';
let selected=0;
let editingId=null;

const $=id=>document.getElementById(id);
const euro=n=>Number(n).toFixed(2)+' Mio.';

function save() {
  localStorage.setItem('legoHockeyV1',JSON.stringify(state));
}

function notice(t) {
  $('notice').textContent=t;
}

function safe(t) {
  return String(t??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function playerById(id) {
  return state.players.find(p=>p.id===Number(id));
}

function nextId() {
  return Math.max(-1,...state.players.map(p=>p.id))+1;
}

function positionTag(p) {
  if(!p.position) return '';
  return `<span class="position ${p.position}">${p.position}</span>`;
}

function managerSelect() {
  return '<label>Manager: <select onchange="selected=+this.value;render()">'+
  state.managers.map((m,i)=>
    `<option value="${i}" ${selected===i?'selected':''}>${safe(m.name)}</option>`
  ).join('')+'</select></label>';
}

function card(p,action='') {
  return `<div class="card row">
    <div>
      <b>${safe(p.name)}</b> ${positionTag(p)}
      <div class="muted">
        ${safe(p.team)} · Marktwert
        <strong>${euro(p.value)}</strong>
        · letzte Punkte: ${p.points}
      </div>
    </div>
    ${action}
  </div>`;
}

function buy(id) {
  let p=playerById(id);
  let m=state.managers[selected];
  if(!p||p.owner!==-1||!state.market.includes(id)||m.cash<p.value)return;
  m.cash=+(m.cash-p.value).toFixed(2);
  p.owner=selected;
  state.market=state.market.filter(x=>x!==id);
  save();
  notice('Spieler gekauft!');
  render();
}

function sell(id) {
  let p=playerById(id);
  if(!p||p.owner!==selected)return;
  state.managers[selected].cash=+(state.managers[selected].cash+p.value).toFixed(2);
  p.owner=-1;
  save();
  notice('Spieler verkauft!');
  render();
}

function finish() {
  if(!confirm('Spieltag abschließen?'))return;

  for(let p of state.players) {
    if(p.owner>=0) {
      state.managers[p.owner].points+=p.points;
    }
    let change=(p.points-5)*.045+(Math.random()-.5)*.12;
    p.value=Math.max(.5,Math.round(p.value*(1+change)*100)/100);
  }

  let free=state.players
    .filter(p=>p.owner===-1)
    .sort(()=>Math.random()-.5);

  state.market=free.slice(0,Math.min(4,free.length)).map(p=>p.id);
  state.round++;
  save();
  notice('Spieltag abgeschlossen!');
  render();
}

// SPIELERVERWALTUNG

function editPlayer(id) {
  editingId=id;
  render();
  window.scrollTo(0,0);
}

function savePlayer() {
  let name=$('editName').value.trim();
  let position=$('editPosition').value;
  let value=Number($('editValue').value.replace(',','.'));

  if(!name||!['GK','DF','O','ST'].includes(position)||
     !Number.isFinite(value)||value<=0) {
    alert('Bitte gültigen Namen, Position und Marktwert eingeben.');
    return;
  }

  value=Math.round(value*100)/100;

  if(editingId===null) {
    state.players.push({
      id:nextId(),
      name,
      team:'Ohne Verein',
      position,
      value,
      owner:-1,
      points:0
    });
  } else {
    let p=playerById(editingId);
    if(!p)return;
    p.name=name;
    p.position=position;
    p.value=value;
  }

  editingId=null;
  save();
  render();
  notice('Spieler gespeichert!');
}

function deletePlayer(id) {
  let p=playerById(id);
  if(!p)return;

  if(!confirm('Spieler "'+p.name+'" wirklich löschen?'))return;

  state.players=state.players.filter(x=>x.id!==id);
  state.market=state.market.filter(x=>x!==id);

  if(editingId===id)editingId=null;

  save();
  render();
  notice('Spieler gelöscht!');
}

function render() {
  let out='';

  if(tab==='market') {
    out='<h2>Transfermarkt</h2>'+managerSelect()+
    `<p>Budget: <strong>${euro(state.managers[selected].cash)}</strong></p>`+
    state.market.map(id=>{
      let p=playerById(id);
      if(!p)return '';
      return card(p,`<button ${state.managers[selected].cash<p.value?'disabled':''}
        onclick="buy(${id})">Kaufen</button>`);
    }).join('');
    if(!state.market.length)out+='<p>Der Markt ist leer.</p>';
  }

  if(tab==='teams') {
    out='<h2>Mannschaften</h2>'+managerSelect()+
    `<p>Budget: ${euro(state.managers[selected].cash)}</p>`+
    state.players.filter(p=>p.owner===selected)
      .map(p=>card(p,`<button onclick="sell(${p.id})">Verkaufen</button>`)).join('');
    if(!state.players.some(p=>p.owner===selected))
      out+='<p>Noch keine Spieler gekauft.</p>';
  }

  if(tab==='round') {
    out=`<h2>Spieltag ${state.round}</h2>
    <p>Trage die Punkte deiner LEGO-Spieler ein.</p>`+
    state.players.map(p=>`
      <div class="card row">
        <div>${safe(p.name)} ${positionTag(p)}
          <div class="muted">${safe(p.team)}</div>
        </div>
        <label>Punkte
          <input type="number" min="-20" max="50" step="1"
          value="${p.points}"
          onchange="playerById(${p.id}).points=Number(this.value)||0;save()">
        </label>
      </div>`).join('')+
    '<button onclick="finish()">✅ Spieltag abschließen</button>';
  }

  if(tab==='table') {
    out='<h2>Manager-Tabelle</h2>'+
    [...state.managers].sort((a,b)=>b.points-a.points)
      .map((m,i)=>`<div class="card">
        ${i+1}. <b>${safe(m.name)}</b> —
        <strong>${m.points} Punkte</strong>
        · Budget ${euro(m.cash)}
      </div>`).join('');
  }

  if(tab==='players') {
    out=`<h2>Spieler verwalten</h2>
    <p class="muted">Spieler hinzufügen, bearbeiten oder löschen.</p>
    <div class="card">
      <h3>${editingId===null?'Neuen Spieler anlegen':'Spieler bearbeiten'}</h3>
      <div class="form-grid">
        <label>Spieler
          <input id="editName" placeholder="Spielername">
        </label>
        <label>Position
          <select id="editPosition">
            <option value="GK">GK – Torwart</option>
            <option value="DF">DF – Verteidiger</option>
            <option value="O">O – Außenstürmer</option>
            <option value="ST">ST – Mittelstürmer</option>
          </select>
        </label>
        <label>Wert (Mio.)
          <input id="editValue" type="number" min="0.01" step="0.01" placeholder="5.00">
        </label>
      </div>
      <button onclick="savePlayer()">💾 ${editingId===null?'Spieler hinzufügen':'Speichern'}</button>
      ${editingId!==null?'<button onclick="editingId=null;render()">Abbrechen</button>':''}
    </div>
    <h3>Alle Spieler (${state.players.length})</h3>`+
    state.players.map(p=>`
      <div class="card row">
        <div>
          <b>${safe(p.name)}</b> ${positionTag(p)}
          <div class="muted">
            ${safe(p.team)} · ${euro(p.value)}
          </div>
        </div>
        <div>
          <button onclick="editPlayer(${p.id})">Bearbeiten</button>
          <button class="danger" onclick="deletePlayer(${p.id})">Löschen</button>
        </div>
      </div>`).join('');
  }

  if(tab==='backup') {
    out='<h2>Sicherung</h2>'+
    '<p>Speichere regelmäßig eine Sicherung.</p>'+
    '<button onclick="backup()">Sicherung herunterladen</button>'+
    '<p><label>Sicherung importieren <input type="file" accept=".json,application/json" onchange="restore(event)"></label></p>'+
    '<button onclick="reset()">Test zurücksetzen</button>';
  }

  $('app').innerHTML=out;

  if(tab==='players'&&editingId!==null) {
    let p=playerById(editingId);
    if(p) {
      $('editName').value=p.name;
      $('editPosition').value=p.position||'DF';
      $('editValue').value=p.value;
    }
  }
}

function backup() {
  let a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(
    [JSON.stringify(state,null,2)],
    {type:'application/json'}
  ));
  a.download='hockey-sicherung.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function restore(e) {
  let f=e.target.files[0];
  if(!f)return;
  f.text().then(t=>{
    let s=JSON.parse(t);
    if(!Array.isArray(s.players)||!Array.isArray(s.managers))
      throw Error('Ungültige Datei');
    state=s;
    editingId=null;
    save();
    render();
    notice('Sicherung geladen');
  }).catch(()=>alert('Sicherung konnte nicht geladen werden'));
}

function reset() {
  if(confirm('Wirklich alle Testdaten löschen?')) {
    state=fresh();
    selected=0;
    editingId=null;
    save();
    render();
  }
}

render();
</script>
</body>
</html>
